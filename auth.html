<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | ChitGPT</title>

    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ChitGPT" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

    <script type="module" src="auth.js" defer></script>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="card">
        <p class="logo">ChitGPT</p>
        <p class="sub">Sign in or create an account</p>

        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <div class="row">
            <button class="btn btn-primary" id="loginBtn">Log in</button>
            <button class="btn" id="signupBtn">Sign up</button>
        </div>

        <div class="divider">or</div>

        <button class="btn-google" id="googleBtn">
            <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </button>

        <div class="footer">
            <a class="link" href="./index.html">
                ← Back to ChitGPT
            </a>
        </div>

        <pre id="output"></pre>
    </div>
</body>
</html>
